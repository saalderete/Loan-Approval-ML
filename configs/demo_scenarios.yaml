# Fictional applicant profiles for the public demo. They are hand-written examples,
# not records from the HMDA file, and contain no personal information.
scenarios:
  - id: steady-first-home
    label: "First home, moderate debt"
    description: "Conventional purchase of a principal residence with a 20% down payment."
    inputs:
      loan_amount: 285000
      property_value: 355000
      income: 112
      debt_to_income_ratio: "30%-<36%"
      combined_loan_to_value_ratio: 80.0
      loan_term: 360
      loan_type: "1"
      loan_purpose: "1"
      lien_status: "1"
      occupancy_type: "1"
      total_units: "1"
      preapproval: "2"
      conforming_loan_limit: "C"
  - id: fha-low-down
    label: "FHA purchase, low down payment"
    description: "FHA-insured purchase with 3.5% down and a debt ratio in the mid-40s."
