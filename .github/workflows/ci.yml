name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - run: ruff check src app tests
      - run: ruff format --check src app tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      # Tests train a small synthetic model; no HMDA download or committed artifacts are needed.
      - run: pytest -m "not e2e" -q
      - name: Verify the committed model loads and passes its checksum
        run: |
          loan-approval list
          loan-approval predict --scenario high-dti-cashout

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t loan-approval-ml:ci .
      - name: Smoke test the API container
        run: |
          docker run -d --name api -p 8000:8000 loan-approval-ml:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/ready && break; sleep 2; done
          curl -fs http://localhost:8000/ready
          curl -fs -X POST http://localhost:8000/api/v1/predict -H 'Content-Type: application/json' \
            -d "$(python3 -c 'import yaml,json; s=yaml.safe_load(open("configs/demo_scenarios.yaml"))["scenarios"][0]["inputs"]; print(json.dumps({"scenario": s}))')"
          docker logs api | tail -20
