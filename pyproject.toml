[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-approval-ml"
version = "1.0.0"
description = "Explainable mortgage-decision research lab trained on public HMDA data, with a fair-lending audit, FastAPI service and Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Alderete" }]
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "joblib>=1.4",
  "pyarrow>=18",
  "pyyaml>=6",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "streamlit>=1.46",
  "altair>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pip-audit>=2.7", "playwright>=1.48"]

[project.scripts]
loan-approval = "loan_approval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loan_approval*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data", "models", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by `ruff format`; long strings are allowed
  "S101",   # assert is fine in tests
  "S603",   # subprocess without shell is used deliberately for training jobs
  "RUF001", # allow typographic characters in UI copy
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"src/loan_approval/data/synthetic.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: browser tests that need a running Streamlit server and Chromium (opt-in)",
  "slow: longer-running integration tests",
]
filterwarnings = ["ignore::DeprecationWarning:altair.*"]
